 two statements:", "extras": [{"type": "text", "content": "Statement I: Restriction endonucleases recognise specific sequence to cut DNA known as palindromic nucleotide sequence."}, {"type": "text", "content": "Statement II: Restriction endonucleases cut the DNA strand a little away from the centre of the palindromic site."}, {"type": "text", "content": "In the light of the above statements, choose the most appropriate answer from the options given below:"}], "options": [{"marker": "a", "text": "Both Statement I and Statement II are incorrect"}, {"marker": "b", "text": "Statement I is correct but Statement II is incorrect"}, {"marker": "c", "text": "Statement I is incorrect but Statement II is correct"}, {"marker": "d", "text": "Both Statement I and Statement II are correct"}], "answerIndex": 3}, {"num": 32, "section": "Biotechnology: Principles and Processes", "stem": "Which of the following is not a desirable feature of a cloning vector?", "extras": [], "options": [{"marker": "a", "text": "Presence of a marker gene"}, {"marker": "b", "text": "Presence of single restriction enzyme site"}, {"marker": "c", "text": "Presence of two or more recognition sites"}, {"marker": "d", "text": "Presence of origin of replication"}], "answerIndex": 2}, {"num": 33, "section": "Biotechnology: Principles and Processes", "stem": "Which one of the following statement is not true regarding gel electrophoresis technique?", "extras": [], "options": [{"marker": "a", "text": "The process of extraction of separated DNA strands from gel is called elution."}, {"marker": "b", "text": "The separated DNA fragments are stained by using ethidium bromide."}, {"marker": "c", "text": "The presence of chromogenic substrate gives blue coloured DNA bands on the gel."}, {"marker": "d", "text": "Bright orange coloured bands of DNA can be observed in the gel when exposed to UV light."}], "answerIndex": 2}, {"num": 34, "section": "Biotechnology: Principles and Processes", "stem": "Separation of DNA fragments is done by a technique known as", "extras": [], "options": [{"marker": "a", "text": "Gel electrophoresis"}, {"marker": "b", "text": "Polymerase Chain Reaction"}, {"marker": "c", "text": "Recombinant technology"}, {"marker": "d", "text": "Southern blotting"}], "answerIndex": 0}, {"num": 35, "section": "Biotechnology: Principles and Processes", "stem": "Pathogenic bacteria gain resistance to antibiotics due to changes in their:", "extras": [], "options": [{"marker": "a", "text": "Nucleoid"}, {"marker": "b", "text": "Cosmids"}, {"marker": "c", "text": "Plasmids"}, {"marker": "d", "text": "Nucleus"}], "answerIndex": 2}, {"num": 36, "section": "Biotechnology: Principles and Processes", "stem": "Which of the following methods is not commonly used for introducing foreign DNA into the plant cell?", "extras": [], "options": [{"marker": "a", "text": "Bacteriophages"}, {"marker": "b", "text": "Agrobacterium mediated transformation"}, {"marker": "c", "text": "Gene gun"}, {"marker": "d", "text": "'Disarmed pathogen' vectors"}], "answerIndex": 0}, {"num": 37, "section": "Biotechnology: Principles and Processes", "stem": "During the purification process for recombinant DNA technology, addition of chilled ethanol precipitates out:", "extras": [], "options": [{"marker": "a", "text": "Histones"}, {"marker": "b", "text": "Polysaccharides"}, {"marker": "c", "text": "RNA"}, {"marker": "d", "text": "DNA"}], "answerIndex": 3}, {"num": 38, "section": "Biotechnology: Principles and Processes", "stem": "In-gel electrophoresis, separated DNA fragments can be visualized with the help of", "extras": [], "options": [{"marker": "a", "text": "acetocarmine in UV radiation"}, {"marker": "b", "text": "ethidium bromide in infrared radiation"}, {"marker": "c", "text": "acetocarmine in bright blue light"}, {"marker": "d", "text": "ethidium bromide in UV radiation"}], "answerIndex": 3}, {"num": 39, "section": "Biotechnology: Principles and Processes", "stem": "The specific palindromic sequence which is ements:", "extras": [{"type": "text", "content": "Statement I: The Indian Government has set up GEAC to make decisions regarding the validity of GM research."}, {"type": "text", "content": "Statement II: Biopiracy refers to the use of bio-resources by native people."}, {"type": "text", "content": "Choose the correct answer."}], "options": [{"marker": "a", "text": "Statement I true, Statement II false"}, {"marker": "b", "text": "Statement I false, Statement II true"}, {"marker": "c", "text": "Both statements true"}, {"marker": "d", "text": "Both statements false"}], "answerIndex": 0}, {"num": 65, "section": "Biotechnology and Its Applications", "stem": "Arrange the steps involved in the action of toxin in Bt Cotton:", "extras": [{"type": "text", "content": "A.\tInactive toxin is converted into active form due to alkaline pH of the insect gut."}, {"type": "text", "content": "B.\tBacillus thuringiensis produces crystals with toxic insecticidal proteins."}, {"type": "text", "content": "C.\tAlkaline pH solubilizes the crystals."}, {"type": "text", "content": "D.\tActivated toxin binds to midgut cells, creates pores, and causes insect death."}, {"type": "text", "content": "E.\tToxin proteins exist as inactive protoxins in bacteria."}], "options": [{"marker": "a", "text": "E → C → B → A → D"}, {"marker": "b", "text": "B → C → A → E → D"}, {"marker": "c", "text": "A → E → B → D → C"}, {"marker": "d", "text": "B → E → C → A → D"}], "answerIndex": 3}, {"num": 66, "section": "Biotechnology and Its Applications", "stem": "Match List-I with List-II. [Lists appear as an image on the source page and were not available in extracted page text.]", "extras": [], "options": [{"marker": "a", "text": "A-III, B-II, C-IV, D-I"}, {"marker": "b", "text": "A-II, B-I, C-IV, D-III"}, {"marker": "c", "text": "A-IV, B-III, C-I, D-II"}, {"marker": "d", "text": "A-II, B-IV, C-I, D-III"}], "answerIndex": 1}, {"num": 67, "section": "Biotechnology and Its Applications", "stem": "The Bt toxin in geneti r": "a", "text": "Vitamin C"}, {"marker": "b", "text": "Omega 3"}, {"marker": "c", "text": "Vitamin A"}, {"marker": "d", "text": "Vitamin B"}], "answerIndex": 2}, {"num": 89, "section": "Biotechnology and Its Applications", "stem": "In Bt cotton, the Bt toxin present in plant tissue as protoxin is converted into active toxin due to:", "extras": [], "options": [{"marker": "a", "text": "Acidic pH of insect gut"}, {"marker": "b", "text": "Action of gut microorganisms"}, {"marker": "c", "text": "Conversion factors in insect gut"}, {"marker": "d", "text": "Alkaline pH of insect gut"}], "answerIndex": 3}, {"num": 90, "section": "Biotechnology and Its Applications", "stem": "Crops engineered for glyphosate are resistant/tolerant to:", "extras": [], "options": [{"marker": "a", "text": "Bacteria"}, {"marker": "b", "text": "Insects"}, {"marker": "c", "text": "Herbicides"}, {"marker": "d", "text": "Fungi"}], "answerIndex": 2}, {"num": 91, "section": "Biotechnology and Its Applications", "stem": "Which body of the Government of India regulates GM research and safety of introducing GM organisms for public use?", "extras": [], "options": [{"marker": "a", "text": "Indian Council of Agricultural Research"}, {"marker": "b", "text": "Genetic Engineering Approval Committee"}, {"marker": "c", "text": "Research Committee on Genetic Manipulation"}, {"marker": "d", "text": "Bio-safety committee"}], "answerIndex": 1}, {"num": 92, "section": "Biotechnology and Its Applications", "stem": "The first human hormone produced by recombinant DNA technology is:", "extras": [], "options": [{"marker": "a", "text": "Insulin"}, {"marker": "b", "text": "Estrogen"}, {"marker": "c", "text": "Thyroxin"}, {"marker": "d", "text": "Progesterone"}], "answerIndex": 0}, {"num": 93, "section": "Biotechnology and Its Applications", "stem": "To obtain virus-free healthy plants from a diseased one by tissue culture, which part(s) of the plant should be taken?", "extras": [], "options": [{"marker": "a", "text": "Epidermis only"}, {"marker": "b", "text": "Palisade parenchyma"}, {"marker": "c", "text": "Both apical and axillary meristems"}, {"marker": "d", "text": "Apical meristem only"}], "answerIndex": 2}];

    let state = {
      mode: 'doc',          // 'doc' | 'quiz'
      showAllAnswers: false,
      searchQuery: '',
      sectionFilter: 'all',
      userSelections: {}  // qNum -> optIndex
    };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatScientificHtml(str) {
      let s = escapeHtml(str);
      // Format superscripts like 2N^2, N^2, 2^n
      s = s.replace(/\^([0-9a-zA-Z\+\-]+)/g, '<sup>$1</sup>');
      // Italicize common scientific and restriction enzyme terms
      s = s.replace(/\b(Agrobacterium tumefaciens|Escherichia coli|E\. coli|Bacillus thuringiensis|B\. thuringiensis|Thermus aquaticus|Meloidogyne incognita|Haemophilus influenzae|Bacillus amyloliquefaciens|Streptomyces albus|Streptococcus aureus|Salmonella typhimurium)\b/g, '<em>$1</em>');
      return s;
    }

    function renderTable(rows) {
      if (!rows || !rows.length) return '';
      const header = rows[0];
      const body = rows.slice(1);
      let html = '<div class="my-3 overflow-x-auto"><table class="w-full max-w-2xl text-sm border-collapse border border-slate-300 rounded-lg overflow-hidden">';
      html += '<thead class="bg-slate-800 text-white"><tr>';
      header.forEach((cell) => {
        html += `<th class="py-2 px-3 text-left font-semibold border border-slate-700">${formatScientificHtml(cell)}</th>`;
      });
      html += '</tr></thead><tbody>';
      body.forEach((row, rIdx) => {
        const rowBg = rIdx % 2 === 1 ? 'bg-slate-50' : 'bg-white';
        html += `<tr class="${rowBg}">`;
        row.forEach((cell, cIdx) => {
          const isCodeCol = (cIdx === 0 || cIdx === 2);
          const cls = isCodeCol ? 'font-semibold text-slate-800 w-12' : 'text-slate-700';
          html += `<td class="py-2 px-3 border border-slate-200 ${cls}">${formatScientificHtml(cell)}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      return html;
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      const qLower = state.searchQuery.trim().toLowerCase();

      const filtered = QUESTIONS.filter((q) => {
        if (state.sectionFilter !== 'all' && q.section !== state.sectionFilter) {
          return false;
        }
        if (!qLower) return true;
        const inStem = (`q${q.num} ` + q.stem).toLowerCase().includes(qLower);
        const inExtras = q.extras.some((ex) => {
          if (ex.type === 'text') return ex.content.toLowerCase().includes(qLower);
          if (ex.type === 'table') return ex.rows.some((r) => r.some((c) => c.toLowerCase().includes(qLower)));
          return false;
        });
        const inOpts = q.options.some((o) => o.text.toLowerCase().includes(qLower));
        return inStem || inExtras || inOpts;
      });

      const filterStatus = document.getElementById('filterStatus');
      const filterStatusText = document.getElementById('filterStatusText');
      if (qLower || state.sectionFilter !== 'all') {
        filterStatus.classList.remove('hidden');
        const secLabel = state.sectionFilter === 'all' ? 'all sections' : state.sectionFilter;
        const queryPart = qLower ? ` matching "${state.searchQuery}"` : '';
        filterStatusText.textContent = `Showing ${filtered.length} of ${QUESTIONS.length} questions in ${secLabel}${queryPart}`;
      } else {
        filterStatus.classList.add('hidden');
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-xl border border-slate-200 p-8 text-center text-slate-500">
            No questions matched your current filter.
          </div>
        `;
        return;
      }

      let lastSection = null;
      const htmlBlocks = [];

      filtered.forEach((q) => {
        if (q.section !== lastSection) {
          lastSection = q.section;
          htmlBlocks.push(`
            <div class="pt-4 pb-2 border-b-2 border-indigo-900">
              <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">Section</span>
              <h3 class="text-xl font-bold text-slate-900">${escapeHtml(q.section)}</h3>
            </div>
          `);
        }

        const selectedIdx = state.userSelections[q.num];
        const hasAnswered = selectedIdx !== undefined;

        const extrasHtml = q.extras.map((ex) => {
          if (ex.type === 'table') {
            return renderTable(ex.rows);
          }
          if (ex.type === 'image') {
            return `
              <div class="my-3 p-3 bg-slate-50 rounded-lg border border-slate-200 inline-block">
                <img src="${ex.src}" alt="Diagram for Q${q.num}" class="max-w-xs sm:max-w-sm h-auto rounded" />
              </div>
            `;
          }
          const txt = ex.content;
          if (/^(Statement\s+(I|II|1|2|A|B)|Assertion\s*(\((A)\)|A)?|Reason\s*(\((R)\)|R)?):/i.test(txt)) {
            const idxColon = txt.indexOf(':');
            const lbl = txt.slice(0, idxColon + 1);
            const rest = txt.slice(idxColon + 1);
            return `<div class="mt-1.5 text-sm text-slate-800"><span class="font-bold text-slate-900">${escapeHtml(lbl)}</span> ${formatScientificHtml(rest)}</div>`;
          }
          if (/^([A-E]\.|\([a-e]\))\s+/i.test(txt)) {
            const m = txt.match(/^([A-E]\.|\([a-e]\))\s*(.*)$/i);
            return `<div class="mt-1 pl-4 flex gap-2 text-sm text-slate-800"><span class="font-semibold text-slate-900 w-6 shrink-0">${escapeHtml(m[1])}</span><span>${formatScientificHtml(m[2])}</span></div>`;
          }
          return `<div class="mt-2 text-sm font-semibold text-slate-800">${formatScientificHtml(txt)}</div>`;
        }).join('');

        const optionsHtml = q.options.map((opt, idx) => {
          const isCorrect = (idx === q.answerIndex);
          const isSelected = (selectedIdx === idx);

          let optStyle = 'border-slate-200 bg-white hover:bg-slate-50 text-slate-800';
          let badgeHtml = '';

          if (state.showAllAnswers) {
            if (isCorrect) {
              optStyle = 'border-emerald-500 bg-emerald-50/70 text-emerald-950 font-medium';
              badgeHtml = '<span class="ml-auto text-xs font-semibold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">Correct</span>';
            }
          } else if (state.mode === 'quiz' && hasAnswered) {
            if (isSelected && isCorrect) {
              optStyle = 'border-emerald-500 bg-emerald-50 text-emerald-950 font-medium';
              badgeHtml = '<span class="ml-auto text-xs font-semibold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">&#10003; Correct</span>';
            } else if (isSelected && !isCorrect) {
              optStyle = 'border-rose-400 bg-rose-50 text-rose-950';
              badgeHtml = '<span class="ml-auto text-xs font-semibold text-rose-700 bg-rose-100 px-2 py-0.5 rounded">&#10007; Your choice</span>';
            } else if (isCorrect) {
              optStyle = 'border-emerald-400 bg-emerald-50/50 text-emerald-900';
              badgeHtml = '<span class="ml-auto text-xs font-semibold text-emerald-700">Correct Answer</span>';
            }
          }

          const cursorCls = state.mode === 'quiz' ? 'cursor-pointer' : 'cursor-default';

          return `
            <button
              type="button"
              data-qnum="${q.num}"
              data-optidx="${idx}"
              class="opt-btn w-full text-left px-3.5 py-2 rounded-lg border text-sm flex items-start gap-2.5 transition ${optStyle} ${cursorCls}"
            >
              <span class="font-semibold text-slate-600 shrink-0">(${escapeHtml(opt.marker)})</span>
              <span class="flex-1">${formatScientificHtml(opt.text)}</span>
              ${badgeHtml}
            </button>
          `;
        }).join('');

        htmlBlocks.push(`
          <article class="q-card bg-white rounded-xl border border-slate-200 shadow-sm p-5 transition">
            <div class="flex items-baseline gap-3">
              <span class="font-bold text-indigo-950 text-base w-11 shrink-0">Q${q.num}.</span>
              <div class="flex-1">
                <h4 class="font-bold text-slate-900 text-base leading-snug">${formatScientificHtml(q.stem)}</h4>
                ${extrasHtml}
                ${q.options.length > 0 ? `<div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2">${optionsHtml}</div>` : ''}
              </div>
            </div>
          </article>
        `);
      });

      container.innerHTML = htmlBlocks.join('');
      updateQuizStats();
    }

    function updateQuizStats() {
      const attempted = Object.keys(state.userSelections).length;
      let correct = 0;
      Object.entries(state.userSelections).forEach(([qNumStr, optIdx]) => {
        const qObj = QUESTIONS.find((q) => q.num === Number(qNumStr));
        if (qObj && qObj.answerIndex === optIdx) correct++;
      });
      const wrong = attempted - correct;
      const acc = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;

      document.getElementById('statAttempted').textContent = attempted;
      document.getElementById('statCorrect').textContent = correct;
      document.getElementById('statWrong').textContent = wrong;
      document.getElementById('statAccuracy').textContent = `${acc}%`;
    }

    // Option Click Delegation
    document.getElementById('questionsContainer').addEventListener('click', (e) => {
      const btn = e.target.closest('.opt-btn');
      if (!btn) return;
      if (state.mode !== 'quiz') return;
      const qNum = Number(btn.getAttribute('data-qnum'));
      const optIdx = Number(btn.getAttribute('data-optidx'));
      state.userSelections[qNum] = optIdx;
      renderQuestions();
    });

    // Section Filter Buttons
    document.querySelectorAll('.sec-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.sectionFilter = btn.getAttribute('data-sec');
        document.querySelectorAll('.sec-btn').forEach((b) => {
          const active = b.getAttribute('data-sec') === state.sectionFilter;
          b.className = active
            ? 'sec-btn px-3 py-1 rounded-full font-semibold bg-indigo-600 text-white shadow-sm transition'
            : 'sec-btn px-3 py-1 rounded-full font-medium bg-white text-slate-700 border border-slate-200 hover:bg-slate-100 transition';
        });
        renderQuestions();
      });
    });

    // Mode Switching
    document.getElementById('modeDocBtn').addEventListener('click', () => {
      state.mode = 'doc';
      document.getElementById('modeDocBtn').className = 'px-3 py-1 text-xs font-semibold rounded-md bg-white text-slate-900 shadow-sm transition';
      document.getElementById('modeQuizBtn').className = 'px-3 py-1 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition';
      document.getElementById('quizStatsBar').classList.add('hidden');
      renderQuestions();
    });

    document.getElementById('modeQuizBtn').addEventListener('click', () => {
      state.mode = 'quiz';
      state.showAllAnswers = false;
      document.getElementById('toggleAnswersBtn').textContent = 'Show Answer Key';
      document.getElementById('modeQuizBtn').className = 'px-3 py-1 text-xs font-semibold rounded-md bg-white text-slate-900 shadow-sm transition';
      document.getElementById('modeDocBtn').className = 'px-3 py-1 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition';
      document.getElementById('quizStatsBar').classList.remove('hidden');
      renderQuestions();
    });

    // Show/Hide Answer Key
    document.getElementById('toggleAnswersBtn').addEventListener('click', () => {
      state.showAllAnswers = !state.showAllAnswers;
      document.getElementById('toggleAnswersBtn').textContent = state.showAllAnswers ? 'Hide Answer Key' : 'Show Answer Key';
      renderQuestions();
    });

    // Reset Practice
    document.getElementById('resetQuizBtn').addEventListener('click', () => {
      state.userSelections = {};
      renderQuestions();
    });

    // Search Input
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      clearSearchBtn.classList.toggle('hidden', !state.searchQuery);
      renderQuestions();
    });

    clearSearchBtn.addEventListener('click', () => {
      state.searchQuery = '';
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      renderQuestions();
    });

    document.getElementById('resetFilterBtn').addEventListener('click', () => {
      state.searchQuery = '';
      state.sectionFilter = 'all';
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      document.querySelectorAll('.sec-btn').forEach((b) => {
        const active = b.getAttribute('data-sec') === 'all';
        b.className = active
          ? 'sec-btn px-3 py-1 rounded-full font-semibold bg-indigo-600 text-white shadow-sm transition'
          : 'sec-btn px-3 py-1 rounded-full font-medium bg-white text-slate-700 border border-slate-200 hover:bg-slate-100 transition';
      });
      renderQuestions();
    });

    // Print / PDF
    document.getElementById('printBtn').addEventListener('click', () => {
      window.print();
    });

    // Initial Render
    renderQuestions();
  </script>
</body>
